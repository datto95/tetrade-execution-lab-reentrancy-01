name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -vvv

      - name: Generate evidence
        run: python3 scripts/generate_evidence.py

      - name: Validate evidence
        run: python3 scripts/generate_evidence.py --validate-only evidence/evidence.json
